# Выкладывает папку site/ на GitHub Pages при каждом push в main.
# Один раз включить: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - id: pages
        uses: actions/configure-pages@v5

      # Превью для мессенджеров (og:url, og:image) требуют полный адрес.
      # Подставляем адрес Pages или свой домен, если он задан в настройках.
      - name: Подставить адрес сайта в превью-теги
        run: |
          sed -i "s#https://example.com/#${{ steps.pages.outputs.base_url }}/#g" site/index.html
          grep -n 'og:url\|og:image"' site/index.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
